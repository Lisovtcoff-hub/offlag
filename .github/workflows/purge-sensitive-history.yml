name: Purge sensitive history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-sensitive-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'security: run one-time history purge'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve sanitized current files
        run: |
          cp backend/get_uuid_3xui.py /tmp/get_uuid_3xui.py
          cp backend/stats_3xui.py /tmp/stats_3xui.py

      - name: Install git-filter-repo
        run: python -m pip install --disable-pip-version-check git-filter-repo

      - name: Remove sensitive paths from every commit
        run: |
          git filter-repo \
            --path .env \
            --path backend/get_uuid_3xui.py \
            --path backend/stats_3xui.py \
            --invert-paths \
            --force

      - name: Restore sanitized helper files
        run: |
          mkdir -p backend
          cp /tmp/get_uuid_3xui.py backend/get_uuid_3xui.py
          cp /tmp/stats_3xui.py backend/stats_3xui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/get_uuid_3xui.py backend/stats_3xui.py
          git commit -m "security: restore sanitized 3x-ui examples"

      - name: Force-push sanitized history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main
          git push --force --tags origin
