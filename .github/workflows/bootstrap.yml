name: Bootstrap complete project

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified payload
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.txt | base64 --decode > /tmp/offlag.tar.xz
          test "$(sha256sum /tmp/offlag.tar.xz | awk '{print $1}')" = "e794d38bb4e68fd9e43178b799e074a2b0b2710d7bea1f19c4c3f0742b28bbf3"
          mkdir -p /tmp/payload
          tar -xJf /tmp/offlag.tar.xz -C /tmp/payload

      - name: Convert repository to monorepo
        run: |
          set -euo pipefail
          mkdir -p /tmp/client
          shopt -s dotglob nullglob
          for path in *; do
            case "$path" in
              .git|.github|.bootstrap) continue ;;
            esac
            mv "$path" /tmp/client/
          done

          rm -rf /tmp/client/third_party /tmp/client/forwindows /tmp/client/assets/cores
          rm -f /tmp/client/windows-vpn.log
          rm -rf /tmp/client/.idea /tmp/client/android/.gradle

          mkdir -p client
          rsync -a /tmp/client/ client/
          rsync -a /tmp/payload/client-overlay/ client/
          rsync -a /tmp/payload/root/ ./

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publish complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete OffLag platform"
          git push
